<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Argument Referee</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1c1b19;--mute:#6b675f;--line:#e4dfd5;--accent:#d9381e;--a:#2563eb;--b:#c026d3;--good:#15803d;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--card:#1e1d1a;--ink:#f3efe6;--mute:#a09b90;--line:#34322d;--accent:#ff5a3d;--a:#6ea0ff;--b:#e879f9;--good:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141311;--card:#1e1d1a;--ink:#f3efe6;--mute:#a09b90;--line:#34322d;--accent:#ff5a3d;--a:#6ea0ff;--b:#e879f9;--good:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
main{max-width:680px;margin:0 auto;padding:28px 18px 60px}
h1{font:800 34px/1.1 "Arial Black",Impact,system-ui,sans-serif;letter-spacing:-.02em;margin:0 0 6px}
h1 span{color:var(--accent)}
.sub{color:var(--mute);margin:0 0 22px}
label{display:block;font:600 13px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:14px 0 6px}
textarea,input{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:15px/1.5 system-ui,sans-serif}
textarea{min-height:200px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:700 16px system-ui,sans-serif;border:0;border-radius:10px;padding:14px 18px;cursor:pointer}
.go{width:100%;margin-top:16px;background:var(--accent);color:#fff}
.go:disabled{opacity:.6;cursor:wait}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:12px}
#err{color:var(--accent);font:14px system-ui,sans-serif;margin-top:12px}
#out{margin-top:28px}
.verdict{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.win{font:800 26px/1.15 "Arial Black",system-ui,sans-serif;margin:0 0 8px}
.ruling{margin:0 0 18px}
.bars{display:grid;gap:10px;margin-bottom:18px}
.bar{font:600 14px system-ui,sans-serif}
.track{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols h3{margin:0 0 6px;font:700 14px system-ui,sans-serif}
.cols ul{margin:0 0 10px;padding-left:18px;font-size:14px}
.tag{font:700 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:8px 0 2px}
.burn{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-style:italic;color:var(--mute)}
@media(max-width:520px){.row,.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Argument <span>Referee</span></h1>
  <p class="sub">Paste the fight. Get a ruling. Send it to whoever lost.</p>

  <div class="row">
    <div><label for="na">Side A name</label><input id="na" value="Me" maxlength="30"></div>
    <div><label for="nb">Side B name</label><input id="nb" value="Them" maxlength="30"></div>
  </div>
  <label for="arg">The argument (texts, transcript, or your summary)</label>
  <textarea id="arg" placeholder="Me: You said you’d do the dishes.&#10;Them: I said I’d do them eventually…"></textarea>
  <button class="go" id="go">Referee this</button>
  <div id="err" role="alert"></div>
  <div id="out"></div>
</main>
<script>
(function(){
  var go=document.getElementById("go"),err=document.getElementById("err"),out=document.getElementById("out");
  function esc(s){var d=document.createElement("div");d.textContent=String(s==null?"":s);return d.innerHTML}
  function list(a){return "<ul>"+(a||[]).map(function(x){return "<li>"+esc(x)+"</li>"}).join("")+"</ul>"}
  function bar(name,score,color){var s=Math.max(0,Math.min(100,Number(score)||0));
    return '<div class="bar">'+esc(name)+" — "+s+"/100<div class=\"track\"><div class=\"fill\" style=\"width:"+s+"%;background:"+color+"\"></div></div></div>"}

  async function pack(o){
    var by=new TextEncoder().encode(JSON.stringify(o)),m="p";
    if(typeof CompressionStream!=="undefined"){by=new Uint8Array(await new Response(new Blob([by]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer());m="z"}
    var bin="";for(var i=0;i<by.length;i++)bin+=String.fromCharCode(by[i]);
    return m+btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }
  async function unpack(t){
    var m=t.charAt(0),s=t.slice(1).replace(/-/g,"+").replace(/_/g,"/");
    while(s.length%4)s+="=";
    var bin=atob(s),by=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)by[i]=bin.charCodeAt(i);
    if(m==="z"){by=new Uint8Array(await new Response(new Blob([by]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer())}
    return JSON.parse(new TextDecoder().decode(by));
  }

  function render(r,na,nb){
    var w=r.winner==="A"?na:(r.winner==="B"?nb:null);
    var head=w?esc(w)+" wins.":"It’s a draw.";
    out.innerHTML='<div class="verdict" id="card"><p class="win">'+head+'</p><p class="ruling">'+esc(r.ruling)+'</p>'+
      '<div class="bars">'+bar(na,r.a&&r.a.score,"var(--a)")+bar(nb,r.b&&r.b.score,"var(--b)")+'</div>'+
      '<div class="cols"><div><h3 style="color:var(--a)">'+esc(na)+'</h3><div class="tag">Strong points</div>'+list(r.a&&r.a.strengths)+'<div class="tag">Fouls</div>'+list(r.a&&r.a.fallacies)+'</div>'+
      '<div><h3 style="color:var(--b)">'+esc(nb)+'</h3><div class="tag">Strong points</div>'+list(r.b&&r.b.strengths)+'<div class="tag">Fouls</div>'+list(r.b&&r.b.fallacies)+'</div></div>'+
      '<div class="burn">'+esc(r.closer)+'</div></div>'+
      '<button class="ghost" id="cp">Copy verdict</button> <button class="ghost" id="cl">Copy shareable link</button>';
    document.getElementById("cp").onclick=function(){
      var t=head+"\n"+r.ruling+"\n"+na+": "+(r.a&&r.a.score)+"/100 | "+nb+": "+(r.b&&r.b.score)+"/100\n"+r.closer;
      try{navigator.clipboard.writeText(t).then(function(){document.getElementById("cp").textContent="Copied"},function(){document.getElementById("cp").textContent="Copy failed"})}catch(e){document.getElementById("cp").textContent="Copy failed"}
    };
    document.getElementById("cl").onclick=async function(){
      var b=document.getElementById("cl");
      try{
        var tok=await pack({w:r.winner,u:r.ruling,c:r.closer,a:r.a,b:r.b,na:na,nb:nb});
        await navigator.clipboard.writeText("https://claude.ai/artifact/D4mAXmfZCBbnC5Pc2MBBk8#"+tok);
        b.textContent="Link copied";
      }catch(e){b.textContent="Copy failed"}
    };
    out.scrollIntoView({behavior:"smooth",block:"start"});
  }

  (async function(){
    var h=(location.hash||"").slice(1);
    if(!h)return;
    try{
      var o=await unpack(h);
      render({winner:o.w,ruling:o.u,closer:o.c,a:o.a,b:o.b},String(o.na||"Side A"),String(o.nb||"Side B"));
      var n=document.createElement("p");n.className="sub";
      n.textContent="Someone sent you this ruling. Scroll up to referee your own argument.";
      out.insertBefore(n,out.firstChild);
    }catch(e){}
  })();

  go.onclick=async function(){
    var text=document.getElementById("arg").value.trim();
    var na=document.getElementById("na").value.trim()||"Side A";
    var nb=document.getElementById("nb").value.trim()||"Side B";
    err.textContent="";
    if(text.length<30){err.textContent="Give the referee a bit more to work with.";return}
    var sample=null;
    try{sample=await claude.use("sample")}catch(e){}
    if(!sample){err.textContent="The referee needs to be opened inside Claude to work.";return}
    go.disabled=true;go.textContent="Reviewing the tape…";out.innerHTML="";
    var prompt="You are a sharp, fair, funny debate referee. Judge the argument below between Side A (\""+na+"\") and Side B (\""+nb+"\"). Judge only the quality of reasoning and evidence, not who you like. Be specific and cite what was actually said. Name logical fallacies precisely when present (strawman, whataboutism, moving the goalposts, ad hominem, etc.). Scores are 0-100. If it is close, say so; winner may be \"tie\".\n\nReturn ONLY JSON: {\"winner\":\"A\"|\"B\"|\"tie\",\"ruling\":\"2-3 sentence verdict\",\"a\":{\"score\":number,\"strengths\":[max 3 short strings],\"fallacies\":[max 3 short strings, empty if none]},\"b\":{same shape},\"closer\":\"one witty, kind-but-honest line to end on\"}\n\nARGUMENT:\n"+text.slice(0,12000);
    try{
      var r=await sample.json(prompt,{cache:false});
      render(r,na,nb);
    }catch(e){
      err.textContent=(e&&e.code==="rate_limited")?"Too many rulings at once. Try again in a minute.":(e&&e.code==="not_granted")?"Permission was declined, so the referee can’t rule.":"The referee dropped the whistle. Try again.";
    }
    go.disabled=false;go.textContent="Referee this";
  };
})();
</script>
</body>
</html>
